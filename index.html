<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Honnesh N Guptha" />
    <meta name="description" content="ZENWAY is a student-only campus mobility micro-exchange for vehicle rentals, ridesharing carpools, and peer package deliveries." />
    <meta name="theme-color" content="#FAF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090B" media="(prefers-color-scheme: dark)" />
    
    <!-- OpenGraph / Social Metadata -->
    <meta property="og:title" content="ZENWAY — Campus Student Mobility & Micro-Exchange" />
    <meta property="og:description" content="Peer-to-peer campus vehicle rentals, ridesharing carpools, and package deliveries exclusively for verified university students." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://zenway.runs-on.dev/" />
    <meta property="og:image" content="/favicon.svg" />
    
    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="ZENWAY — Campus Student Mobility & Micro-Exchange" />
    <meta name="twitter:description" content="Peer-to-peer campus vehicle rentals, ridesharing carpools, and package deliveries exclusively for verified university students." />
    <meta name="twitter:image" content="/favicon.svg" />

    <title>ZENWAY — Campus Student Mobility & Micro-Exchange</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('zenway_theme') || localStorage.getItem('theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
